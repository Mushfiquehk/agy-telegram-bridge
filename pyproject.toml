[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-telegram-bridge"
version = "0.3.0"
description = "Chat with the Google Antigravity CLI (agy) on your PC from Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mushfique Hasan Khan" }]
dependencies = [
  "python-telegram-bot>=21.0,<23",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
voice = ["faster-whisper>=1.0"]

[project.scripts]
agy-bridge = "agy_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
